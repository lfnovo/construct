name: Bug report
description: Report a reproducible problem in Construct
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Construct. Use synthetic examples and remove private paths or document content.
  - type: input
    id: version
    attributes:
      label: Construct version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system
      description: Include the version and architecture when known.
      placeholder: macOS 15.5 (Apple Silicon) or Windows 11 x64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Startup and Locations
        - Markdown Preview or Edit
        - Review
        - Search and local index
        - OKF Explore or Health
        - CLI linter
        - Local MCP
        - Filesystem and history
        - Git Diff
        - Distribution and installation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a minimal folder and synthetic Markdown where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private document content, and sensitive local paths.
          required: true
