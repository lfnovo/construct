  <g stroke="#f6f7ff" stroke-width="7">
    <circle cx="207" cy="258" r="16" fill="#64e7a0"/>
    <circle cx="270" cy="197" r="16" fill="#8b8cf8"/>
    <circle cx="329" cy="251" r="16" fill="#64e7a0"/>
    <circle cx="278" cy="319" r="16" fill="#8b8cf8"/>
