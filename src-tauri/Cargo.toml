[package]
name = "agent-context"
version = "0.1.0"
description = "A desktop workspace for coding agent context files"
authors = ["Luis Novo"]
edition = "2021"

[lib]
name = "agent_context_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
