name: Feature request
description: Propose a focused improvement to Construct
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than a specific implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Startup and Locations
        - Markdown Preview or Edit
        - Review
        - Search and local index
        - OKF Explore or Health
        - CLI linter
        - Local MCP
        - Filesystem and history
        - Git Diff
        - Accessibility
        - Distribution
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
