  <rect width="512" height="512" rx="112" fill="url(#background)"/>
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
  <circle cx="258" cy="257" r="184" fill="url(#aura)"/>

  <!-- An open Construct portal that also reads as a geometric C. -->
  <path d="M354 126H191C168 126 150 144 150 167V345C150 368 168 386 191 386H354"
