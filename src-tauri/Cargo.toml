[package]
name = "construct"
version = "0.1.3"
description = "A desktop knowledge workspace for coding agents"
authors = ["Luis Novo"]
license = "MIT"
repository = "https://github.com/lfnovo/construct"
edition = "2021"

[lib]
name = "construct_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
blake3 = "1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
pulldown-cmark = "0.13"
surrealdb = { version = "3.2.3", default-features = false, features = ["kv-surrealkv"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
dirs = "6"
glob = "0.3.3"
