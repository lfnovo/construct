<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="70" y1="52" x2="438" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b1d25"/>
      <stop offset="1" stop-color="#0c0d12"/>
    </linearGradient>
    <linearGradient id="portal" x1="151" y1="121" x2="362" y2="397" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5f7f2"/>
      <stop offset=".58" stop-color="#b9ffd4"/>
      <stop offset="1" stop-color="#5ce59a"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(258 257) rotate(90) scale(184)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62e9a0" stop-opacity=".17"/>
      <stop offset="1" stop-color="#62e9a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
