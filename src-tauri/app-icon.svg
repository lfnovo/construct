  <path d="M354 126H191C168 126 150 144 150 167V345C150 368 168 386 191 386H354"
        fill="none" stroke="url(#portal)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Connected knowledge moving through the portal. -->
  <g fill="none" stroke="#7d80f7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M207 258L270 197L329 251L278 319L207 258Z"/>
